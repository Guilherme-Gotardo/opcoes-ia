services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opcoes_ia
      POSTGRES_PASSWORD: opcoes_ia
      POSTGRES_DB: opcoes_ia
    ports:
      - "5433:5432"
    volumes:
      - opcoes_ia_db:/var/lib/postgresql/data

volumes:
  opcoes_ia_db:
