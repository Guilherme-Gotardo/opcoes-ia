# Parâmetros da skill covered-options-strategy.
# Ajuste aqui conforme seu perfil de risco — não hardcode esses valores em código.

iv_rank_minimo: 50
delta_min: 0.20
delta_max: 0.35
dias_vencimento_min: 20
dias_vencimento_max: 45
premio_minimo_pct: 0.5        # % do valor da posição coberta

# ATENÇÃO — este limiar NÃO desconta o prazo. Uma opção de 45 dias e uma de
# 10 disputam o mesmo mínimo, e o prêmio tende a crescer com o tempo: na
# prática isso favorece os vencimentos mais longos da faixa permitida. É
# escolha registrada, não esquecimento. O relatório mostra o equivalente
# mensal ao lado do valor bruto para o viés ficar visível.
#
# Para barrar por rendimento normalizado, descomente abaixo: vira um
# critério ADICIONAL (não substitui `premio_minimo_pct`). Ausente, nada
# muda — mexer na postura de risco tem que ser ato deliberado.
# premio_minimo_pct_ao_mes: 1.5
exposicao_maxima_pct_ativo: 20 # % do patrimônio (a mercado) em opção DESCOBERTA por ativo
dias_bloqueio_antes_resultado: 7

# Idade máxima aceitável da última cotação para ela valer como preço de
# mercado numa decisão. 72h cobre sexta-fechamento → segunda-abertura sem
# cotação nova, que é ausência de pregão, não dado velho. Feriado prolongado
# estoura a janela — e parar nesse caso é o certo: a avaliação vira "dado
# insuficiente" com o ticker e a idade no relatório, em vez de decidir sobre
# preço de custo. Valor inválido falha alto, nunca cai no padrão em silêncio.
cotacao_frescor_maximo_horas: 72

# Idade máxima do DADO DA OPÇÃO (preço, delta, IV rank) para entrar num
# critério. Chave própria porque as duas grandezas envelhecem diferente: o
# preço da ação sobrevive a um fim de semana, mas delta e IV rank mudam com
# o tempo até o vencimento mesmo sem negócio novo. Omitido, herda a janela
# da cotação acima.
# opcao_frescor_maximo_horas: 24

# O que fazer quando NÃO existe data de resultado confiável para o ativo:
#   bloquear  (padrão) não emite sugestão, mas o relatório explica que o
#             bloqueio foi por dado faltante e mostra os critérios que já
#             passavam. Postura conservadora.
#   sinalizar emite a sugestão com aviso explícito de que a agenda de
#             resultados não foi verificada. Você assume conferir a data.
# Reprovação em critério de mercado sempre vence: delta fora da faixa
# reprova independentemente desta política.
politica_resultado_desconhecido: bloquear

# --- Risco de resultado (Earnings Event Service) ---
# Dias até a divulgação que classificam cada nível de risco. Precisam ser
# crescentes; o serviço falha alto se não forem.
earnings_risco_critical_dias: 1
earnings_risco_high_dias: 3
earnings_risco_medium_dias: 7
earnings_risco_low_dias: 15

# Confiança mínima (0–100) para que uma data de resultado seja usada numa
# decisão. Abaixo disso o evento é tratado como "não temos data" — o que
# BLOQUEIA de forma conservadora, em vez de aprovar com dado fraco.
#   95–100 confirmado por RI/regulatório · 85–94 duas fontes concordam
#   60–84  uma fonte confiável           · 30–59 só fonte secundária
# 60 exige, na prática, pelo menos uma fonte confiável e recente.
earnings_confianca_minima: 60
