name: ETL diário

on:
  schedule:
    # 21:10 UTC ≈ 18:10 horário de Brasília (após o fechamento da B3)
    - cron: "10 21 * * 1-5"
  workflow_dispatch: {}   # permite rodar manualmente pelo GitHub também

jobs:
  etl:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPLAB_TOKEN: ${{ secrets.OPLAB_TOKEN }}
      BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar cotações
        run: python -m src.etl.fetch_quotes

      - name: Coletar opções
        run: python -m src.etl.fetch_options

      - name: Coletar notícias
        run: python -m src.etl.fetch_news
        continue-on-error: true  # ainda não integrado a uma fonte real

      # Promove as datas de resultado registradas para a tabela que o motor
      # de opções consulta. Sem este passo, `manage add` grava a data e nada
      # a torna consultável: o critério de resultado fica indisponível e
      # nenhuma sugestão sai. SEM continue-on-error de propósito — agenda
      # desatualizada bloqueia sugestão em silêncio, que é justamente o que
      # este passo existe para acabar.
      #
      # Padrão `manual`: não usa rede, só lê `earnings_manual_entries`.
      # Para incluir a CVM quando a cobertura for considerada confiável,
      # basta `--fontes manual,cvm`.
      #
      # Quando a avaliação de estratégia entrar no workflow (pendência 3 do
      # roadmap), ela vai DEPOIS deste passo — consolidar depois de avaliar
      # só teria efeito no dia seguinte.
      - name: Consolidar datas de resultado
        run: python -m src.earnings.ingest

# Pré-requisito: cadastrar DATABASE_URL, OPLAB_TOKEN e BRAPI_TOKEN em
# Settings > Secrets and variables > Actions no repositório do GitHub.
#
# DATABASE_URL aponta para o Postgres gerenciado no Neon, que é a fonte da
# verdade da carteira — NÃO para o Postgres do docker-compose, que o Actions
# não alcança e que passou a ser banco descartável de teste.
#
# Para preparar uma instância nova (ou recriar a atual):
#   python -m src.db.bootstrap
# Ver docs/RUNBOOK-POSTGRES.md.
